name: Auto Publish SEO/GEO Matrix Article

on:
  schedule:
    # 每 4 天自动运行一次（UTC 02:00 / 北京时间 10:00）
    - cron: '0 2 */4 * *'
  workflow_dispatch:
    inputs:
      topic_id:
        description: '可选：指定强制生成的专题 ID（留空则按队列顺序自动选取未发布主题）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Auto Publish System (DeepSeek Engine)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FORCE_TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: node scripts/auto-publish.mjs

      - name: Build, Test & SEO Audit Self-Healing Verification
        run: |
          pnpm build
          pnpm audit:seo
          pnpm test

      - name: Commit and Push to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ docs/ scripts/matrix-topics.json
          
          if git diff --staged --quiet; then
            echo "没有检测到新生成的文章或变更，无需提交。"
          else
            # 注意：严格移除 [skip ci]，确保 Cloudflare Pages 或下游 CI 能够正常触发自动化构建与上线
            git commit -m "feat(content): publish new SEO/GEO matrix article [automated]"
            git push origin main
            echo "新文章已成功推送至 main 分支，触发 Cloudflare 自动部署！"
          fi
